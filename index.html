<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The APK Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0910;--fg:#f3efe6;--mut:#8f8aa0;--gold:#d7b86a;--line:#25222f;--panel:#13111a;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:300 16px/1.6 Sora,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(70vmax 50vmax at 85% -10%,#d7b86a1c,transparent 60%),radial-gradient(60vmax 50vmax at -10% 60%,#5b3cff14,transparent 60%)}
svg{display:block}
.wrap{position:relative;max-width:1080px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{display:flex;gap:10px;align-items:center;font:500 20px "Bodoni Moda",serif;letter-spacing:.02em}
.logo svg{width:26px;height:26px;color:var(--gold)}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);border:1px solid var(--line);padding:7px 14px;border-radius:99px}
.pill svg{width:14px;height:14px;color:var(--gold)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:34px 0 60px}
h1{font:500 clamp(40px,8vw,84px)/1 "Bodoni Moda",serif;margin:0 0 20px;letter-spacing:-.01em}
h1 i{color:var(--gold)}
.lead{color:var(--mut);max-width:440px;margin:0 0 28px}
.cta{display:inline-flex;gap:10px;align-items:center;border:0;cursor:pointer;font:600 15px Sora;color:#1c1405;padding:15px 26px;border-radius:99px;background:linear-gradient(120deg,#f3dc9b,#c9a24c 55%,#e8cc83);box-shadow:0 10px 30px #d7b86a33;transition:transform .25s,box-shadow .25s;text-decoration:none}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 40px #d7b86a55}.cta:active{transform:scale(.97)}
.cta svg{width:18px;height:18px}
.cta:focus-visible,.card:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.stack{position:relative;height:300px}
.stack .card{position:absolute;left:50%;top:50%;width:min(340px,86vw);margin:-107px 0 0 -170px;animation:fl 7s ease-in-out infinite}
.stack .card:nth-child(1){--r:-14deg;transform:rotate(-14deg) translate(-30px,-40px)}
.stack .card:nth-child(2){--r:-2deg;animation-delay:-2s;transform:rotate(-2deg)}
.stack .card:nth-child(3){--r:10deg;animation-delay:-4s;transform:rotate(10deg) translate(30px,46px)}
@keyframes fl{50%{translate:0 -14px}}
h2{font:500 32px "Bodoni Moda",serif;margin:0 0 6px}
.sec p{color:var(--mut);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px;padding-bottom:80px}
/* CARD */
.card{--c1:#1b1726;--c2:#0c0a12;--ink:#f3efe6;--acc:#d7b86a;position:relative;aspect-ratio:1.586;width:100%;border-radius:20px;color:var(--ink);cursor:pointer;
perspective:900px;transform-style:preserve-3d;transition:transform .25s ease-out;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));box-shadow:0 28px 50px -18px #000c,0 0 0 1px #ffffff14 inset;
background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden;text-align:left;border:0;padding:0;font:inherit;display:block}
.t-gold{--c1:#e6c778;--c2:#8c6a22;--ink:#2a1c04;--acc:#4a3410}
.t-platinum{--c1:#eef0f5;--c2:#9aa2b4;--ink:#1b2130;--acc:#3b4660}
.t-crimson{--c1:#8d1431;--c2:#24040d;--ink:#ffe9ec;--acc:#ffb9c3}
.card svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.35;color:var(--acc)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,30%) var(--my,0%),#ffffff55,transparent 45%);mix-blend-mode:soft-light;pointer-events:none}
.cin{position:absolute;inset:0;padding:6.5% 7%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#ffffff1f;border:1px solid #ffffff2e;font:700 20px "Bodoni Moda",serif;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.nfc{width:26px;height:26px;opacity:.8}
.mid{display:flex;align-items:center;gap:14px}
.chip{width:44px;height:33px;border-radius:7px;background:linear-gradient(135deg,#f1d98d,#b88b2e);position:relative;opacity:.95}
.chip::before{content:"";position:absolute;inset:6px 8px;border:1px solid #6a4b0f88;border-radius:3px}
.nm{font:500 clamp(20px,5vw,26px)/1.1 "Bodoni Moda",serif;letter-spacing:.01em;text-shadow:0 1px 0 #ffffff33}
.bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;opacity:.9}
.bot b{display:block;font:600 14px Sora;letter-spacing:.06em}
.bot small{font-size:10px;opacity:.7}
/* SHEET */
#sheet{position:fixed;inset:0;z-index:20;display:none;background:#05040acc;backdrop-filter:blur(10px);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 30px}
#sheet.on{display:block;animation:fi .35s}@keyframes fi{from{opacity:0}}
.sb{max-width:460px;margin:0 auto;animation:up .6s cubic-bezier(.2,.9,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sb .card{cursor:default;margin:18px 0 26px;animation:flip .9s cubic-bezier(.2,.9,.2,1)}@keyframes flip{from{transform:rotateY(-90deg) scale(.9)}}
.x{background:none;border:1px solid var(--line);color:var(--fg);width:42px;height:42px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.perks{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px}
.perks li{display:flex;gap:12px;align-items:center;color:#cfc9de;font-size:14px}
.perks svg{width:18px;height:18px;color:var(--gold);flex:none}
.notes{color:var(--mut);font-size:14px;white-space:pre-wrap;margin:0 0 24px;border-left:2px solid var(--gold);padding-left:14px}
.empty{grid-column:1/-1;color:var(--mut);padding:30px 0}
@media (max-width:760px){.hero{grid-template-columns:1fr}.stack{height:270px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></svg>The APK Vault</div>
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg><span id="count">Loading</span></span>
  </nav>
  <header class="hero">
    <div>
      <h1>Apps worth <i>keeping</i>, one tap away.</h1>
      <p class="lead">Every build is checked and signed before it lands here. Choose a card, download, install.</p>
      <a class="cta" href="#apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>Browse downloads</a>
    </div>
    <div class="stack" aria-hidden="true">
      <div class="card t-crimson"><div class="cin"><div class="top"><div class="ic">V</div></div><div class="nm">Vault Black</div></div></div>
      <div class="card t-platinum"><div class="cin"><div class="top"><div class="ic">V</div></div><div class="nm">Vault Platinum</div></div></div>
      <div class="card t-gold"><div class="cin"><div class="top"><div class="ic">V</div></div><div class="nm">Vault Gold</div></div></div>
    </div>
  </header>
  <section class="sec" id="apps">
    <h2>Available now</h2><p>Tap a card to see what’s inside.</p>
    <div class="grid" id="grid"></div>
  </section>
</div>
<div id="sheet" role="dialog" aria-modal="true"><div class="sb" id="sb"></div></div>

<script>
const SB=supabase.createClient("https://gisgmjnamasmwhobmxvz.supabase.co","sb_publishable_6cGKWDBqz-t3ehwd5dVCaQ_94JvsS0V");
const $=i=>document.getElementById(i);
const I={
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
 box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>',
 phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
 nfc:'<svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6c3 3.5 3 8.5 0 12M12 4c4 4.5 4 11.5 0 16M16 2c5 6 5 14 0 20"/></svg>'
};
const BG='<svg class="bg" viewBox="0 0 340 214" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width=".5"><g transform="translate(250 60)">'+Array.from({length:14},(_,i)=>`<ellipse rx="${20+i*9}" ry="${60+i*3}" transform="rotate(${i*6})"/>`).join('')+'</g></svg>';
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cardHTML=(a,tag="button")=>`<${tag} class="card t-${esc(a.theme)}" data-id="${esc(a.id)}" aria-label="${esc(a.name)}">${BG}<div class="cin">
<div class="top"><div class="ic">${a.icon_url?`<img src="${esc(a.icon_url)}" alt="">`:esc((a.name||"A")[0].toUpperCase())}</div>${I.nfc}</div>
<div class="mid"><div class="chip"></div><div class="nm">${esc(a.name)}</div></div>
<div class="bot"><div><small>VERSION</small><b>${esc(a.version)}</b></div><div><small>SIZE</small><b>${esc(a.size_label||"—")}</b></div><div style="text-align:right"><small>TYPE</small><b>${esc(a.category)}</b></div></div></div></${tag}>`;
function tilt(el){
  el.addEventListener("pointermove",e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    el.style.setProperty("--ry",((x-.5)*14)+"deg");el.style.setProperty("--rx",((.5-y)*14)+"deg");el.style.setProperty("--mx",x*100+"%");el.style.setProperty("--my",y*100+"%")});
  el.addEventListener("pointerleave",()=>{el.style.setProperty("--rx","0deg");el.style.setProperty("--ry","0deg")});
}
let apps=[];
async function load(){
  const {data,error}=await SB.from("apk_apps").select("*").eq("published",true).order("created_at",{ascending:false});
  const g=$("grid");
  if(error){g.innerHTML='<div class="empty">Couldn’t load apps. Check your connection and refresh.</div>';$("count").textContent="Offline";return}
  apps=data;$("count").textContent=apps.length+(apps.length===1?" app":" apps");
  if(!apps.length){g.innerHTML='<div class="empty">Nothing here yet. New apps appear as soon as they’re published.</div>';return}
  g.innerHTML=apps.map(a=>cardHTML(a)).join("");
  g.querySelectorAll(".card").forEach((c,i)=>{tilt(c);c.animate([{opacity:0,transform:"translateY(30px)"},{opacity:1,transform:"none"}],{duration:600,delay:i*90,easing:"cubic-bezier(.2,.9,.2,1)",fill:"backwards"});c.onclick=()=>openSheet(c.dataset.id)});
}
function openSheet(id){
  const a=apps.find(x=>x.id===id);if(!a)return;
  $("sb").innerHTML=`<button class="x" id="cl" aria-label="Close">${I.x}</button>${cardHTML(a,"div")}
  <h2>${esc(a.name)}</h2><p style="color:var(--mut);margin:0 0 20px">Version ${esc(a.version)}</p>
  <ul class="perks"><li>${I.shield}Signed and checked by the publisher</li><li>${I.box}${esc(a.size_label||"Small download")}</li><li>${I.phone}Works on Android phones and tablets</li></ul>
  ${a.notes?`<p class="notes">${esc(a.notes)}</p>`:""}<div id="act"><button class="cta" id="dl" style="width:100%;justify-content:center">${I.dl}Download APK</button></div>`;
  $("sheet").classList.add("on");$("cl").onclick=close;$("dl").onclick=()=>go(a);
}
function close(){$("sheet").classList.remove("on")}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

/* Direct one-tap download */
let resetTimer;
function go(a){
  const name=a.name.replace(/\s+/g,"_")+"_"+a.version+".apk";
  const l=document.createElement("a");
  l.href=a.apk_url+(a.apk_url.includes("?")?"&":"?")+"download="+encodeURIComponent(name);
  l.download=name;
  l.rel="noopener";
  document.body.append(l);l.click();l.remove();
  SB.rpc("apk_track_download",{app_id:a.id}).then(()=>{});

  const b=$("dl");
  if(b){
    b.innerHTML=I.ok+"Download started";
    clearTimeout(resetTimer);
    resetTimer=setTimeout(()=>{const x=$("dl");if(x)x.innerHTML=I.dl+"Download APK"},2500);
  }
}
document.querySelectorAll(".stack .card").forEach(c=>c.style.cursor="default");
load();
</script>
</body>
</html>
